name: Deploy static website to Pages

on:
  push:
    paths:
      - 'docs/www/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload documents
        run: |
          mkdir -p ./docs/www/docs
          cp ./docs/presentations/mid-pitch/mid-pitch.pdf ./docs/www/docs/mid-pitch.pdf
          cp ./docs/poster/poster.pdf ./docs/www/docs/poster.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/www'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5